name: Publicar frontend en GitHub Pages
# Se publica al subir cambios en frontend/ (o en este archivo). También: Actions → Run workflow.

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Armar sitio (app real en / y ambiente de pruebas en /pruebas/)
        run: |
          mkdir -p _site/pruebas
          cp -r frontend/. _site/
          cp -r frontend/. _site/pruebas/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
